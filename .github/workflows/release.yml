name: Release & Master Build

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      frontend_published: ${{ steps.changesets.outputs.publishedPackages != '' && contains(steps.changesets.outputs.publishedPackages, '@app/frontend') }}
      backend_published: ${{ steps.changesets.outputs.publishedPackages != '' && contains(steps.changesets.outputs.publishedPackages, '@app/backend') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn run version-packages
          # Мы используем npx changeset tag для генерации Git-тегов и GitHub Releases
          publish: npx changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    needs: release
    if: needs.release.outputs.frontend_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        run: echo "current-version=$(jq -r '.version' apps/frontend/package.json)" >> $GITHUB_OUTPUT

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/aporechniy/chessappfrontend:${{ steps.version.outputs.current-version }}
            ghcr.io/aporechniy/chessappfrontend:latest

  build-backend:
    needs: release
    if: needs.release.outputs.backend_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        run: echo "current-version=$(jq -r '.version' apps/backend/package.json)" >> $GITHUB_OUTPUT

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/aporechniy/chessappbackend:${{ steps.version.outputs.current-version }}
            ghcr.io/aporechniy/chessappbackend:latest
