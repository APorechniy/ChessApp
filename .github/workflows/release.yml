name: Release & Master Build

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      frontend_bumped: ${{ steps.detect.outputs.frontend_bumped }}
      frontend_version: ${{ steps.detect.outputs.frontend_version }}
      backend_bumped: ${{ steps.detect.outputs.backend_bumped }}
      backend_version: ${{ steps.detect.outputs.backend_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Нужно минимум 2 коммита, чтобы сравнить версии

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          corepack enable
          yarn install --immutable

      # 1. Changesets создает/обновляет PR "Version Packages".
      # Мы НЕ передаем параметр publish, чтобы он не пытался умничать.
      - name: Create or Update Version PR
        uses: changesets/action@v1
        with:
          version: yarn run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. ЖЕЛЕЗНОЕ ОПРЕДЕЛЕНИЕ: изменилась ли версия в package.json?
      - name: Detect Version Bumps
        id: detect
        run: |
          # Проверяем Frontend
          PREV_FE=$(git show HEAD~1:apps/frontend/package.json 2>/dev/null | jq -r '.version // empty')
          CURR_FE=$(jq -r '.version' apps/frontend/package.json)
          if [ -n "$PREV_FE" ] && [ "$PREV_FE" != "$CURR_FE" ]; then
            echo "🚀 Frontend версия изменилась: $PREV_FE -> $CURR_FE"
            echo "frontend_bumped=true" >> $GITHUB_OUTPUT
            echo "frontend_version=$CURR_FE" >> $GITHUB_OUTPUT
          fi

          # Проверяем Backend
          PREV_BE=$(git show HEAD~1:apps/backend/package.json 2>/dev/null | jq -r '.version // empty')
          CURR_BE=$(jq -r '.version' apps/backend/package.json)
          if [ -n "$PREV_BE" ] && [ "$PREV_BE" != "$CURR_BE" ]; then
            echo "🚀 Backend версия изменилась: $PREV_BE -> $CURR_BE"
            echo "backend_bumped=true" >> $GITHUB_OUTPUT
            echo "backend_version=$CURR_BE" >> $GITHUB_OUTPUT
          fi

      # 3. Создаем Git-теги и страницу в GitHub Releases через официальный GitHub CLI
      - name: Create Git Tags & GitHub Releases
        if: steps.detect.outputs.frontend_bumped == 'true' || steps.detect.outputs.backend_bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.detect.outputs.frontend_bumped }}" = "true" ]; then
            TAG="@app/frontend@${{ steps.detect.outputs.frontend_version }}"
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

          if [ "${{ steps.detect.outputs.backend_bumped }}" = "true" ]; then
            TAG="@app/backend@${{ steps.detect.outputs.backend_version }}"
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  # --- СБОРКА ФРОНТЕНДА ---
  build-frontend:
    needs: release
    if: needs.release.outputs.frontend_bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/aporechniy/chessappfrontend:${{ needs.release.outputs.frontend_version }}
            ghcr.io/aporechniy/chessappfrontend:latest

  # --- СБОРКА БЭКЕНДА ---
  build-backend:
    needs: release
    if: needs.release.outputs.backend_bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/aporechniy/chessappbackend:${{ needs.release.outputs.backend_version }}
            ghcr.io/aporechniy/chessappbackend:latest
